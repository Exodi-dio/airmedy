name: Build Android APK (prod release)

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK 30.0.15729638
        run: sdkmanager "ndk;30.0.15729638" "cmake;3.22.1"

      - name: Write mobile/local.properties
        working-directory: mobile
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          EOF
          echo "local.properties written with sdk.dir=$ANDROID_SDK_ROOT"

      - name: Make gradlew executable
        working-directory: mobile
        run: chmod +x gradlew

      - name: Install Python + fonttools for font subsetting
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --quiet --break-system-packages fonttools brotli

      - name: Build FFmpeg for Android (arm64-v8a + armeabi-v7a)
        working-directory: mobile
        run: bash ../scripts/build-ffmpeg-android.sh all

      - name: Generate release keystore
        working-directory: mobile
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkeypair \
            -alias airmedy \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -keystore "$KEYSTORE_DIR/release.jks" \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Airmedy CI, OU=Mobile, O=Exodi-dio, L=NA, S=NA, C=US"
          echo "Keystore generated."

      - name: Build prod release APK (arm64-v8a / 64-bit)
        working-directory: mobile
        env:
          MOBILE_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.jks
          MOBILE_KEYSTORE_PASSWORD: changeit
          MOBILE_KEY_ALIAS: airmedy
          MOBILE_KEY_PASSWORD: changeit
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleProdRelease --no-daemon --stacktrace -Pabi=arm64-v8a
          APK_REL=$(find androidApp/build/outputs/apk -type f -name 'androidApp-prod-release.apk' | head -n1)
          if [[ -z "$APK_REL" ]]; then
            echo "arm64-v8a APK not found under androidApp/build/outputs/apk"
            find androidApp/build -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_REL" "$RUNNER_TEMP/androidApp-1.1.1-arm64-v8a.apk"
          echo "Staged: $RUNNER_TEMP/androidApp-1.1.1-arm64-v8a.apk from $APK_REL"

      - name: Build prod release APK (armeabi-v7a / 32-bit)
        working-directory: mobile
        env:
          MOBILE_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.jks
          MOBILE_KEYSTORE_PASSWORD: changeit
          MOBILE_KEY_ALIAS: airmedy
          MOBILE_KEY_PASSWORD: changeit
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleProdRelease --no-daemon --stacktrace -Pabi=armeabi-v7a
          APK_REL=$(find androidApp/build/outputs/apk -type f -name 'androidApp-prod-release.apk' | head -n1)
          if [[ -z "$APK_REL" ]]; then
            echo "armeabi-v7a APK not found under androidApp/build/outputs/apk"
            find androidApp/build -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_REL" "$RUNNER_TEMP/androidApp-1.1.1-armeabi-v7a.apk"
          echo "Staged: $RUNNER_TEMP/androidApp-1.1.1-armeabi-v7a.apk from $APK_REL"

      - name: Build prod release APK (universal)
        working-directory: mobile
        env:
          MOBILE_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.jks
          MOBILE_KEYSTORE_PASSWORD: changeit
          MOBILE_KEY_ALIAS: airmedy
          MOBILE_KEY_PASSWORD: changeit
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleProdRelease --no-daemon --stacktrace -Pabi=universal
          APK_REL=$(find androidApp/build/outputs/apk -type f -name 'androidApp-prod-release.apk' | head -n1)
          if [[ -z "$APK_REL" ]]; then
            echo "universal APK not found under androidApp/build/outputs/apk"
            find androidApp/build -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_REL" "$RUNNER_TEMP/androidApp-1.1.1-universal.apk"
          echo "Staged: $RUNNER_TEMP/androidApp-1.1.1-universal.apk from $APK_REL"

      - name: Verify staged release APKs
        run: |
          set -euo pipefail
          for file in \
            "$RUNNER_TEMP/androidApp-1.1.1-arm64-v8a.apk" \
            "$RUNNER_TEMP/androidApp-1.1.1-armeabi-v7a.apk" \
            "$RUNNER_TEMP/androidApp-1.1.1-universal.apk"; do
            test -s "$file"
          done
          ls -la "$RUNNER_TEMP"/*.apk

      - name: Upload APKs to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-rework-1.1.1
          path: |
            ${{ runner.temp }}/androidApp-1.1.1-arm64-v8a.apk
            ${{ runner.temp }}/androidApp-1.1.1-armeabi-v7a.apk
            ${{ runner.temp }}/androidApp-1.1.1-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create / update release (v1.1.1)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: Airmedy Mobile — Android Rework v1.1.1
          body: |
            ## Airmedy Mobile — Android Rework v1.1.1

            - This is a **local mobile app rework** made by **exodi_dio**.
            - The original Airmedy build is **not mine**; the original app was **PC-only** and never shipped for Android.
            - Rebuilt as a native Android app (Kotlin Multiplatform + Compose), performance-tuned for low-end devices.

            ### Downloads

            | APK | ABI | For |
            |---|---|---|
            | `androidApp-1.1.1-arm64-v8a.apk` | arm64-v8a | 64-bit devices (recommended) |
            | `androidApp-1.1.1-armeabi-v7a.apk` | armeabi-v7a | 32-bit devices |
            | `androidApp-1.1.1-universal.apk` | arm64 + armv7 | any device (largest file) |
          files: |
            ${{ runner.temp }}/androidApp-1.1.1-arm64-v8a.apk
            ${{ runner.temp }}/androidApp-1.1.1-armeabi-v7a.apk
            ${{ runner.temp }}/androidApp-1.1.1-universal.apk
          draft: false
          prerelease: false
