name: Build Android APK (prod release)

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK 30.0.15729638
        run: sdkmanager "ndk;30.0.15729638" "cmake;3.22.1"

      - name: Write mobile/local.properties
        working-directory: mobile
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          EOF
          echo "local.properties written with sdk.dir=$ANDROID_SDK_ROOT"

      - name: Make gradlew executable
        working-directory: mobile
        run: chmod +x gradlew

      - name: Build FFmpeg for Android (arm64-v8a)
        working-directory: mobile
        run: bash ../scripts/build-ffmpeg-android.sh arm64-v8a

      - name: Generate release keystore
        working-directory: mobile
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkeypair \
            -alias airmedy \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -keystore "$KEYSTORE_DIR/release.jks" \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Airmedy CI, OU=Mobile, O=Exodi-dio, L=NA, S=NA, C=US"
          echo "Keystore generated."

      - name: Build prod release APK
        working-directory: mobile
        env:
          MOBILE_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.jks
          MOBILE_KEYSTORE_PASSWORD: changeit
          MOBILE_KEY_ALIAS: airmedy
          MOBILE_KEY_PASSWORD: changeit
        run: ./gradlew :androidApp:assembleProdRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=$(find androidApp/build/outputs/apk -type f -name 'app-prod-release.apk' | head -n1)
          if [[ -z "$APK" ]]; then
            echo "APK not found under androidApp/build/outputs/apk"
            find androidApp/build -type f -name '*.apk' || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"
          ls -la "$APK"

      - name: Upload APK to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: android-prod-release
          generate_release_notes: true
          files: ${{ steps.locate.outputs.apk_path }}
          draft: false
          prerelease: false
